<!DOCTYPE html>
<html>
<head>
    <title>Google OAuth Test</title>
</head>
<body>
    <h1>Google OAuth Configuration Test</h1>
    <div id="info"></div>
    
    <script>
        // Load the config from your server
        fetch('/config.js')
            .then(response => response.text())
            .then(script => {
                eval(script);
                document.getElementById('info').innerHTML = `
                    <p><strong>Current Origin:</strong> ${window.location.origin}</p>
                    <p><strong>Google Client ID:</strong> ${window.__GOOGLE_CLIENT_ID__}</p>
                    <p><strong>Full URL:</strong> ${window.location.href}</p>
                `;
            })
            .catch(error => {
                document.getElementById('info').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            });
    </script>
</body>
</html>
